<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Galaxy Stars - GridWise Visualization</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body, html {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #0a0a0f;
        height: 100%;
        overscroll-behavior: none;
      }

      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        display: block;
        /* Claim drag gestures for the simulation instead of letting the
           browser scroll/zoom the page with them. */
        touch-action: none;
      }

      #controls {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(20, 20, 25, 0.9);
        backdrop-filter: blur(20px);
        padding: 15px 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        z-index: 10;
        min-width: 180px;
      }

      .panel-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Disclosure control: hidden entirely on large screens, where the
         panel is always open. */
      .panel-trigger,
      .panel-toggle {
        display: none;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        color: #888;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input[type="range"] {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: #2a2a30;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);
      }

      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);
      }

      #starCount {
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
      }

      button {
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: transparent;
        color: white;
        position: relative;
        animation: textGlow 3s ease-in-out infinite;
      }
      
      button:nth-child(1) {
        animation-delay: 0s;
      }
      
      button:nth-child(2) {
        animation-delay: 1s;
      }
      
      button:nth-child(3) {
        animation-delay: 2s;
      }
      
      @keyframes textGlow {
        0%, 100% {
          text-shadow: 
            0 0 5px rgba(255, 255, 255, 0.3),
            0 0 10px rgba(255, 255, 255, 0.2);
        }
        50% {
          text-shadow: 
            0 0 10px rgba(255, 255, 255, 0.6),
            0 0 20px rgba(255, 255, 255, 0.4),
            0 0 30px rgba(255, 255, 255, 0.2);
        }
      }
      
      button:hover {
        animation: textGlowFast 1.5s ease-in-out infinite;
      }
      
      @keyframes textGlowFast {
        0%, 100% {
          text-shadow: 
            0 0 8px rgba(255, 255, 255, 0.5),
            0 0 15px rgba(255, 255, 255, 0.3);
        }
        50% {
          text-shadow: 
            0 0 15px rgba(255, 255, 255, 0.8),
            0 0 30px rgba(255, 255, 255, 0.5),
            0 0 45px rgba(255, 255, 255, 0.3);
        }
      }
      
      button:active {
        transform: scale(0.95);
      }

      .info-text {
        color: #555;
        font-size: 10px;
        text-align: center;
        margin-top: 5px;
      }

      #errorDisplay {
        display: none;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(180, 30, 30, 0.92);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 8px;
        z-index: 20;
        pointer-events: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      }

      .mode-btn {
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        animation: none;
        font-size: 13px;
        padding: 10px;
        min-height: 44px;
      }

      .mode-btn[aria-pressed="true"] {
        border-color: #764ba2;
        background: rgba(118, 75, 162, 0.25);
      }

      /* Small screens: collapse the panel to a single button instead of
         shrinking the controls. The open panel previously ate roughly a
         quarter of a phone screen; folding it away costs nothing, whereas
         shrinking tap targets below ~44px trades a mis-tap for a few
         reclaimed pixels - and each of these buttons launches a slow GPU
         operation. */
      @media (height < 600px) or (width < 600px) {
        #controls {
          top: 10px;
          right: 10px;
          padding: 8px;
          min-width: 0;
        }

        .panel-toggle {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 44px;
          height: 44px;
          color: #fff;
          cursor: pointer;
          border-radius: 8px;
        }

        .panel-body {
          display: none;
        }

        .panel-trigger:checked ~ .panel-body {
          display: flex;
          padding-top: 8px;
          min-width: 200px;
          max-height: calc(100dvh - 80px);
          overflow-y: auto;
        }

        .button-group {
          flex-direction: row;
          gap: 8px;
          margin-top: 4px;
        }

        .button-group button {
          flex: 1;
          padding: 12px 4px;
          /* Explicit floor rather than relying on font metrics. */
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="errorDisplay"></div>
    
    <div id="controls">
      <!-- CSS-only disclosure: the panel collapses to a single button on
           small screens. Deliberately not JS - interactive_demo.mjs aborts
           early when WebGPU is missing, and the panel should still fold
           away on the error screen. -->
      <input type="checkbox" id="panel-trigger" class="panel-trigger">
      <label for="panel-trigger" class="panel-toggle" aria-label="Toggle controls" title="Toggle controls">
        <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true">
          <path fill="currentColor" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.484C18,14.304,17.335,14.969,16.516,14.969H1.484C0.665,14.969,0,14.304,0,13.484l0,0C0,12.665,0.665,12,1.484,12h15.032C17.335,12,18,12.665,18,13.484L18,13.484z" />
        </svg>
      </label>

      <div class="panel-body">
        <div class="control-group">
          <label>Particles</label>
          <input type="range" id="starSlider" min="1000" max="100000" step="1000" value="10000">
          <div id="starCount">10K</div>
        </div>

        <div class="button-group">
          <button id="sortBtn">Sort</button>
          <button id="scanBtn">Scan</button>
          <button id="reduceBtn">Reduce</button>
        </div>

        <button id="modeBtn" class="mode-btn" aria-pressed="false">Mode: Attract</button>

        <div class="info-text">Drag to move particles • Mode or Shift flips pull/push</div>
      </div>
    </div>

    <script type="module" src="interactive_demo.mjs"></script>
  </body>
</html>
