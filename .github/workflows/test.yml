name: Run WebGPU Primitives Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci
        npx puppeteer browsers install chrome

    - name: Run Headless WebGPU Tests
      run: node misc/run_headless_tests.js

    - name: Run Node.js WebGPU Regression Tests
      run: npm run test:node

    - name: Run WGSL Functions Subgroup Emulation Tests
      run: npm run test:wgsl
