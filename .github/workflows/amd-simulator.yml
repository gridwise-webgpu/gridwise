# Correctness on simulated AMD GPUs, without a GPU. See misc/run_amd_simulator.sh.
#
# rocjitsu (ROCm/rocm-systems, emulation/rocjitsu) executes AMD GPU
# instructions on the CPU behind the amdgpu kernel-driver interface. Mesa's
# Vulkan driver (RADV) drives the simulated GPU, and Node's webgpu package
# (Dawn) runs on RADV. That covers RDNA3 (gfx1100) and RDNA4 (gfx1201); RADV
# does not support the CDNA (Instinct) GPUs rocjitsu also simulates.
name: AMD GPU simulator

on:
  workflow_dispatch:
  # While this is a prototype, run on PRs only when the setup itself changes.
  pull_request:
    paths:
      - ".github/workflows/amd-simulator.yml"
      - "misc/run_amd_simulator.sh"
      - "misc/list_adapters.mjs"

permissions:
  contents: read

concurrency:
  group: amd-simulator-${{ github.ref }}
  cancel-in-progress: true

env:
  # nightly ROCm SDK whose rocjitsu is used
  ROCM_SDK_VERSION: 10.2.0a20261006

jobs:
  simulate:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # A prototype: report, but do not block, until it has a baseline.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [gfx1201, gfx1100]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # rocjitsu ships with AMD's nightly ROCm SDK ("TheRock"), as used by
      # IREE's CI. Pinned to a release that includes RDNA Vulkan support.
      - name: Install the ROCm SDK (rocjitsu)
        run: |
          venv="$RUNNER_TEMP/rocm-venv"
          python3 -m venv "$venv"
          index=https://nightly.repo.amd.com/rocm/whl-next/
          "$venv/bin/python" -m pip install -q --pre --index-url "$index" "rocm==$ROCM_SDK_VERSION"
          "$venv/bin/rocm-sdk" init
          root=$("$venv/bin/rocm-sdk" path --root)
          if [[ ! -x $root/bin/rocjitsu && ! -x $root/bin/mirage ]]; then
            echo "rocjitsu is not in the core SDK; adding the devel package"
            "$venv/bin/python" -m pip install -q --pre --index-url "$index" "rocm[devel]==$ROCM_SDK_VERSION"
            "$venv/bin/rocm-sdk" init
            root=$("$venv/bin/rocm-sdk" path --root)
          fi
          "$venv/bin/rocm-sdk" version
          ls "$root/bin" | grep -E '^(rocjitsu|mirage)$'
          ls "$root/share/rocjitsu/configs" | grep -E 'gfx1100|gfx1201'
          echo "ROCM_ROOT=$root" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Run the correctness tests on a simulated ${{ matrix.target }}
        run: |
          mkdir -p results
          timeout --signal=TERM 100m \
            misc/run_amd_simulator.sh ${{ matrix.target }} 2>&1 | tee "results/${{ matrix.target }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Summarize
        if: always()
        run: |
          log="results/${{ matrix.target }}.log"
          [[ -f $log ]] || exit 0
          {
            echo "### Simulated ${{ matrix.target }}"
            echo '```'
            grep -E "^WebGPU adapter|^Correctness:" "$log" || true
            echo '```'
            echo "Failures by test family:"
            echo '```'
            grep '^\[FAIL\]' "$log" | awk '{print $2}' | sort | uniq -c || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # the same, as annotations (visible on the PR and through the API)
          t=${{ matrix.target }}
          echo "::notice title=$t adapter::$(grep -m1 '^WebGPU adapter' "$log" || echo none)"
          echo "::notice title=$t correctness::$(grep -m1 '^Correctness:' "$log" || echo 'no summary line')"
          fails=$(grep '^\[FAIL\]' "$log" | awk '{print $2}' | sort | uniq -c | xargs || true)
          [[ -z $fails ]] || echo "::warning title=$t failures by family::$fails"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd-simulator-${{ matrix.target }}
          path: results/
          retention-days: 14
